[workspace]
members = [
	# apps
	"app/template_readonly",
	# "app/image",
	# libs
	"libs/identifiers",
	"libs/telemetry",
	"libs/utils",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.1"

[workspace.dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["macros"] }
axum-extra = { version = "0.12.6", features = ["form"] }
dotenvy = "0.15.7"
futures = "0.3.34"
hypertext = { version = "0.12.1", features = ["axum"] }
itertools = "0.15.0"
jiff = { version = "0.2.37", features = ["serde"] }
num-traits = "0.2.19"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
thiserror = { version = "2.0.20" }
tokio = { version = "1.53.1", features = ["full"] }
tower = { version = "0.5.3", features = ["timeout", "util"] }
tower-http = { version = "0.7.0", features = ["trace", "fs", "timeout", "compression-full"] }
tower_governor = { version = "0.8.0" }
tracing = "0.1.44"
url = "2.5.8"

identifiers = { path = "libs/identifiers" }
telemetry = { path = "libs/telemetry" }
utils = { path = "libs/utils" }
