[package]
name = "telemetry"
edition.workspace = true
version.workspace = true

[dependencies]
# Workspace dependencies
thiserror = { workspace = true }
tracing = { workspace = true }

utils = { workspace = true }

# Tracing subscriber re-export
tracing-opentelemetry = { version = "0.33.0" }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# OpenTelemetry core - using compatible versions
opentelemetry = { version = "0.33.0" }
opentelemetry-semantic-conventions = { version = "0.33.0" }
opentelemetry_sdk = { version = "0.33.0", features = ["rt-tokio"] }

# Exporters - using compatible versions
opentelemetry-otlp = { version = "0.33.0", features = [
	"grpc-tonic",
	"tls-aws-lc",
	"tls-webpki-roots",
] }
